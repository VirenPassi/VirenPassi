name: GitHub Profile Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Trophy
        run: |
          npx @ryo-ma/github-profile-trophy@latest generate -u VirenPassi --theme tokyonight --no-bg false --no-frame true --column 8 --margin-w 15 --output assets/trophies.svg
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update-trophies"
