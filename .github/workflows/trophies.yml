name: GitHub Profile Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const res = await fetch('https://github-profile-trophy.vercel.app/?username=VirenPassi&theme=tokyonight&no-bg=false&no-frame=true&column=8&margin-w=15');
            if (!res.ok) throw new Error(`Failed to fetch trophy: ${res.statusText}`);
            const svgText = await res.text();
            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/trophies.svg', svgText);

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile trophies"
          file_pattern: assets/trophies.svg
